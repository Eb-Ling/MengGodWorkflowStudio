<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vertex Transform · Workflow Shader</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./enhanced.css"></head>
<body class="standalone-page"><header class="topbar"><div class="brand"><span class="brand-mark">◇</span> Workflow Shader <small>MVP</small></div><nav class="page-tabs"><a class="page-tab" href="./index.html">片段工作流</a><a class="page-tab active" href="./vertex.html">顶点变换</a></nav></header>
<main class="vertex-page"><section class="vertex-intro"><span class="eyebrow">VERTEX SHADER</span><h1>顶点变换</h1><p>每个 Plugin 实例必须传入四个顶点。预览展示本地顶点依次经过缩放、旋转、平移的结果；最终由 BoxUtil 世界矩阵投影。</p></section><section class="vertex-workbench"><article class="transform-card"><h2>插件几何 · 必填</h2><p>三角条带顺序：左下、右下、左上、右上。</p><div id="vertex-inputs" class="vertex-inputs"></div></article><article class="transform-card"><h2>变换参数</h2><div class="transform-grid"><label>平移 X<input id="tx" type="number" value="0" step="1"></label><label>平移 Y<input id="ty" type="number" value="0" step="1"></label><label>缩放 X<input id="sx" type="number" value="1" step="0.1"></label><label>缩放 Y<input id="sy" type="number" value="1" step="0.1"></label><label>旋转（度）<input id="rotation" type="number" value="0" step="1"></label></div></article><article class="transform-card vertex-preview-card"><h2>顶点预览</h2><svg id="vertex-preview" viewBox="0 0 420 280"></svg></article><article class="transform-card code-card"><h2>生成的顶点逻辑</h2><pre id="vertex-code"></pre></article></section></main><script type="module" src="./vertex.js"></script></body></html>
