<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顶点工作流 · MengGod</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./enhanced.css"><link rel="stylesheet" href="./vertex.css"></head>
<body class="vertex-editor"><header class="topbar"><div class="brand"><span class="brand-mark">◇</span> Workflow Shader</div><nav class="page-tabs"><a class="page-tab" href="./index.html">片段工作流</a><a class="page-tab active" href="./vertex.html">顶点工作流</a></nav><button id="save-vertex">保存到当前工作流</button><span id="vertex-status" role="status"></span></header>
<main class="vertex-layout"><aside class="vertex-tools"><h2>顶点节点</h2><p>连接输入选择框建立有向连线，拖动标题整理布局。</p><div id="vertex-catalog"></div><h3>预设</h3><button id="vertex-default">直通顶点</button><button id="vertex-wave">时间波动</button><h3>阶段边界</h3><p>局部几何 → 节点变形 → 局部变换 → 实例变换 → 视口投影</p><p>输出 position 为局部坐标，uv 为片段采样坐标。实例变换由运行时统一应用。</p><a href="./index.html">在片段页声明共享／实例参数</a></aside>
<section class="vertex-center"><div class="vertex-canvas-toolbar"><button id="fit-vertex">适应画布</button><button id="reset-zoom">100%</button><span>输入选择框连接节点 · 拖动标题调整布局</span></div><div class="vertex-canvas-scroll"><div id="vertex-canvas"><svg id="vertex-wires" aria-hidden="true"></svg><div id="vertex-nodes"></div></div></div><section class="vertex-code"><details><summary>查看生成的局部顶点逻辑</summary><pre id="vertex-code"></pre></details></section></section>
<aside class="vertex-properties"><h2>几何预览</h2><svg id="vertex-preview" viewBox="0 0 420 280" aria-label="顶点与实例几何预览"></svg><p>预览展示顶点变形和实例排列，不用于测量游戏 GPU 性能。</p><label>预览数量<input id="preview-count" type="number" min="1" max="64" value="1"></label><label>选中预览实例<input id="preview-selected" type="number" min="1" max="64" value="1"></label><label>预览时间（秒）<input id="preview-time" type="number" step="0.1" value="0"></label><label><input id="animate" type="checkbox">播放时间</label><h3>参数预览值</h3><div id="vertex-parameters"></div><h3>四顶点几何</h3><p>三角条带顺序：左下、右下、左上、右上。支持非矩形四边形。</p><div id="vertex-inputs"></div><h3>图后局部变换</h3><div class="transform-grid"><label>平移 X<input id="tx" type="number" value="0"></label><label>平移 Y<input id="ty" type="number" value="0"></label><label>缩放 X<input id="sx" type="number" step="0.1" value="1"></label><label>缩放 Y<input id="sy" type="number" step="0.1" value="1"></label><label>旋转（度）<input id="rotation" type="number" value="0"></label></div></aside></main>
<script type="module" src="./vertex.js"></script></body></html>
