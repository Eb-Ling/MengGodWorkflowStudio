<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Node · Workflow Shader</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./enhanced.css"></head>
<body class="standalone-page"><header class="topbar"><div class="brand"><span class="brand-mark">◇</span> Workflow Shader <small>MVP</small></div><nav class="page-tabs"><a id="return-workflow" class="page-tab" href="./index.html">返回当前工作流</a><a class="page-tab" href="./vertex.html">顶点变换</a><a class="page-tab active" href="./custom-node.html">自定义节点</a></nav></header>
<main class="custom-page"><section class="custom-intro"><span class="eyebrow">CUSTOM NODE</span><h1>自定义 GLSL 节点</h1><p>节点只定义端口、表达式和辅助函数；禁止写入 GL 状态或创建资源。创建后会存入本地节点库，回到片段工作流即可加入画布。</p></section><section class="custom-editor"><article><h2>节点定义</h2><label>节点名称<input id="custom-title" value="Pulse Mask"></label><label>输入端口（每行：名称 类型 默认值）<textarea id="custom-inputs">uv VEC2 wf_uv&#10;time FLOAT u_time</textarea></label><label>输出类型<select id="custom-output-type"><option>FLOAT</option><option>VEC2</option><option>VEC3</option><option selected>VEC4</option></select></label></article><article><h2>GLSL 方法体</h2><label>辅助函数<textarea id="custom-helper">float customPulse(vec2 uv, float t) {&#10;  return 0.5 + 0.5 * sin(length(uv - 0.5) * 18.0 - t * 4.0);&#10;}</textarea></label><label>输出表达式（使用 $&#123;input&#125; 引用端口）<textarea id="custom-expression">vec4(vec3(customPulse($&#123;uv&#125;, $&#123;time&#125;)), 1.0)</textarea></label><button id="create-custom-node" class="primary">保存到本地节点库</button></article><article class="custom-preview"><h2>契约预览</h2><pre id="custom-preview"></pre><p id="custom-validation">等待输入…</p></article></section></main><script type="module" src="./custom-node.js"></script></body></html>
